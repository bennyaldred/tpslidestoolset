<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <?!= include('SidebarCss'); ?>
  </head>
  <body>
    <div id="app" class="app">
      <div id="status" class="status" hidden></div>

      <section class="block">
        <label class="label" for="text">Text</label>
        <textarea id="text" class="textarea" rows="2" spellcheck="false">Variable</textarea>
      </section>

      <section class="block">
        <div class="row-between">
          <label class="label" for="font-search">Typeface</label>
          <button id="refresh-fonts" class="link-btn" type="button" title="Reload the font list from Google Fonts">Refresh</button>
        </div>
        <input id="font-search" class="input" type="search" placeholder="Search variable fonts…" autocomplete="off">
        <select id="font-select" class="select" size="6"></select>
        <div id="font-meta" class="hint"></div>
      </section>

      <section class="block">
        <div class="preview-frame">
          <div id="preview" class="preview">Variable</div>
        </div>
        <div id="preview-hint" class="hint"></div>
      </section>

      <section class="block">
        <div class="row-between">
          <span class="label">Axes</span>
          <button id="reset-axes" class="link-btn" type="button">Reset</button>
        </div>
        <div id="axes"></div>
      </section>

      <section class="block">
        <span class="label">Type settings</span>
        <div class="grid-2">
          <label class="field">
            <span class="field-label">Size (pt)</span>
            <input id="font-size" class="input" type="number" min="4" max="400" step="1" value="72">
          </label>
          <label class="field">
            <span class="field-label">Tracking (em)</span>
            <input id="tracking" class="input" type="number" min="-0.2" max="1" step="0.01" value="0">
          </label>
          <label class="field">
            <span class="field-label">Line height</span>
            <input id="line-height" class="input" type="number" min="0.5" max="4" step="0.05" value="1.1">
          </label>
          <label class="field">
            <span class="field-label">Colour</span>
            <input id="color" class="input color" type="color" value="#1a1a1a">
          </label>
        </div>
        <div class="seg" id="align" role="group" aria-label="Alignment">
          <button type="button" data-value="left" class="seg-btn is-active">Left</button>
          <button type="button" data-value="center" class="seg-btn">Center</button>
          <button type="button" data-value="right" class="seg-btn">Right</button>
        </div>
      </section>

      <section class="block">
        <span class="label">Insert as</span>
        <div class="seg" id="mode" role="group" aria-label="Insert mode">
          <button type="button" data-value="text" class="seg-btn is-active">Editable text</button>
          <button type="button" data-value="vector" class="seg-btn">Vector outlines</button>
        </div>
        <div id="mode-note" class="hint"></div>
        <div id="fidelity" class="fidelity"></div>
        <label class="check" id="new-slide-wrap" hidden>
          <input id="new-slide" type="checkbox">
          <span>Import onto a new slide instead of this one</span>
        </label>
      </section>

      <section class="block actions">
        <button id="insert" class="btn btn-primary" type="button">Insert</button>
        <div class="row">
          <button id="apply" class="btn" type="button" title="Restyle the shapes selected in the slide">Apply to selection</button>
          <button id="load" class="btn" type="button" title="Read axis values back from a shape this add-on made">Load selection</button>
        </div>
      </section>

      <section class="block">
        <span class="label">Presets</span>
        <div class="row">
          <select id="preset-select" class="select-inline"><option value="">—</option></select>
          <button id="preset-delete" class="btn btn-small" type="button" title="Delete the selected preset">Delete</button>
        </div>
        <div class="row">
          <input id="preset-name" class="input" type="text" placeholder="Preset name">
          <button id="preset-save" class="btn btn-small" type="button">Save</button>
        </div>
      </section>
    </div>

    <?!= include('SidebarJs'); ?>
  </body>
</html>
