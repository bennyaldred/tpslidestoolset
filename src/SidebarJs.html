<script>
/**
 * Sidebar controller.
 *
 * Two things happen here that are worth knowing before reading on:
 *
 * 1. The live preview uses the real variable font, loaded from the Google
 *    Fonts CSS2 API with its full axis ranges, so `font-variation-settings`
 *    can move continuously.
 * 2. Vector export re-fetches that same font as a binary, decompresses the
 *    woff2, and pulls real glyph outlines at the current axis values. Those
 *    outlines go to the server, which wraps them in a PPTX and imports them as
 *    native Slides freeform shapes.
 */
(function () {
  'use strict';

  var CDN = {
    // HarfBuzz is the reference OpenType engine — the same one browsers use to
    // render text. opentype.js was tried first and got variable-glyph
    // interpolation wrong: Google Sans Flex came out torn at high ROND values,
    // and it threw outright on several families' feature lookups.
    harfbuzz: 'https://cdn.jsdelivr.net/npm/harfbuzzjs@1.6.1/dist/index.mjs',
    woff2: 'https://cdn.jsdelivr.net/npm/wawoff2@2.0.1/build/decompress_binding.js',
    paper: 'https://cdn.jsdelivr.net/npm/paper@0.12.18/dist/paper-core.min.js'
  };

  /** Guard against pathological input turning into a megabyte of path data. */
  var MAX_OUTLINE_COMMANDS = 120000;

  /** Selected on open when the catalogue has it. */
  var DEFAULT_FAMILY = 'Google Sans Flex';

  var state = {
    fonts: [],
    axisRegistry: {},
    font: null,          // the selected catalog entry
    values: {},          // axis tag -> current value
    align: 'left'
  };

  var els = {};
  var fontBinaryCache = {};
  var libsPromise = null;

  // ---------------------------------------------------------------- utils

  function $(id) { return document.getElementById(id); }

  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  /** Promise wrapper around google.script.run. */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (result) {
          if (result && result.ok === false) reject(new Error(result.error || 'Something went wrong.'));
          else resolve(result);
        })
        .withFailureHandler(function (error) { reject(error); })
        [name].apply(null, args);
    });
  }

  function setStatus(message, kind) {
    var node = els.status;
    if (!message) { node.hidden = true; node.textContent = ''; return; }
    node.hidden = false;
    node.textContent = message;
    node.className = 'status' + (kind ? ' is-' + kind : '');
  }

  function busy(isBusy) {
    els.app.classList.toggle('is-busy', !!isBusy);
  }

  function axisInfo(tag) {
    var known = state.axisRegistry[tag];
    return {
      name: known ? known.name : tag,
      step: known ? known.step : 1,
      precision: known ? known.precision : 0,
      order: known ? known.order : 500,
      unit: known && known.unit ? known.unit : ''
    };
  }

  function round(value, precision) {
    var factor = Math.pow(10, precision || 0);
    return Math.round(value * factor) / factor;
  }

  function sortedAxes(font) {
    return font.axes.slice().sort(function (a, b) {
      return axisInfo(a.tag).order - axisInfo(b.tag).order;
    });
  }

  // ------------------------------------------------------- font CSS loading

  /**
   * Google Fonts CSS2 wants axis tags in ASCII order (uppercase custom axes
   * before lowercase registered ones) and treats `ital` as selecting a
   * separate face, which forces the semicolon tuple-list form.
   */
  function buildFontCssUrl(family, axes) {
    var base = 'https://fonts.googleapis.com/css2?family=' +
      encodeURIComponent(family).replace(/%20/g, '+');
    if (!axes.length) return base + '&display=swap';

    var sorted = axes.slice().sort(function (a, b) {
      return a.tag < b.tag ? -1 : (a.tag > b.tag ? 1 : 0);
    });
    var range = function (axis) {
      return axis.min === axis.max
        ? String(axis.min)
        : String(axis.min) + '..' + String(axis.max);
    };
    var tags = sorted.map(function (axis) { return axis.tag; }).join(',');
    var hasItal = sorted.some(function (axis) { return axis.tag === 'ital'; });

    var values;
    if (!hasItal) {
      values = sorted.map(range).join(',');
    } else {
      values = ['0', '1'].map(function (ital) {
        return sorted.map(function (axis) {
          return axis.tag === 'ital' ? ital : range(axis);
        }).join(',');
      }).join(';');
    }
    return base + ':' + tags + '@' + values + '&display=swap';
  }

  function ensurePreviewFont(font) {
    var id = 'vf-font-css';
    var link = document.getElementById(id);
    if (!link) {
      link = document.createElement('link');
      link.id = id;
      link.rel = 'stylesheet';
      document.head.appendChild(link);
    }
    var url = buildFontCssUrl(font.family, font.axes);
    if (link.getAttribute('href') !== url) link.setAttribute('href', url);
  }

  // ------------------------------------------------------------- preview

  function variationSettings() {
    if (!state.font) return '';
    return state.font.axes.map(function (axis) {
      return '"' + axis.tag + '" ' + round(state.values[axis.tag], 3);
    }).join(', ');
  }

  function renderPreview() {
    if (!state.font) return;
    var text = els.text.value || ' ';
    var sizePt = Number(els.fontSize.value) || 72;
    // Show the true relative size, capped so a 300pt headline still fits.
    var displayPx = Math.min(sizePt * 1.333, 120);

    var node = els.preview;
    node.textContent = text;
    node.style.fontFamily = '"' + state.font.family + '", sans-serif';
    node.style.fontSize = displayPx + 'px';
    node.style.fontVariationSettings = variationSettings();
    node.style.fontWeight = state.values.wght !== undefined ? round(state.values.wght, 0) : 400;
    node.style.fontStyle = state.values.ital >= 0.5 ? 'italic' : 'normal';
    node.style.letterSpacing = (Number(els.tracking.value) || 0) + 'em';
    node.style.lineHeight = Number(els.lineHeight.value) || 1.1;
    node.style.color = els.color.value;
    node.style.textAlign = state.align;

    els.previewHint.textContent = displayPx < sizePt * 1.333
      ? 'Preview scaled down; inserts at ' + sizePt + 'pt.'
      : '';
  }

  // --------------------------------------------------------- axis controls

  function renderAxes() {
    var container = els.axes;
    container.innerHTML = '';
    if (!state.font) return;

    sortedAxes(state.font).forEach(function (axis) {
      var info = axisInfo(axis.tag);
      var wrap = document.createElement('div');
      wrap.className = 'axis';

      var head = document.createElement('div');
      head.className = 'axis-head';
      head.innerHTML =
        '<span><span class="axis-name"></span> <span class="axis-tag"></span></span>';
      head.querySelector('.axis-name').textContent = info.name;
      head.querySelector('.axis-tag').textContent = axis.tag;

      var number = document.createElement('input');
      number.className = 'axis-value';
      number.type = 'number';
      number.min = axis.min;
      number.max = axis.max;
      number.step = info.step;
      number.value = round(state.values[axis.tag], info.precision);
      head.appendChild(number);
      wrap.appendChild(head);

      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = axis.min;
      slider.max = axis.max;
      slider.step = info.step;
      slider.value = state.values[axis.tag];
      wrap.appendChild(slider);

      function apply(value, syncSlider, syncNumber) {
        var clamped = Math.min(axis.max, Math.max(axis.min, Number(value)));
        if (isNaN(clamped)) return;
        state.values[axis.tag] = clamped;
        if (syncSlider) slider.value = clamped;
        if (syncNumber) number.value = round(clamped, info.precision);
        renderPreview();
      }

      slider.addEventListener('input', function () { apply(slider.value, false, true); });
      number.addEventListener('change', function () { apply(number.value, true, false); });

      container.appendChild(wrap);
    });
  }

  function resetAxes() {
    if (!state.font) return;
    state.font.axes.forEach(function (axis) {
      state.values[axis.tag] = axis.defaultValue;
    });
    renderAxes();
    renderPreview();
  }

  function currentSpec() {
    return {
      family: state.font ? state.font.family : '',
      axes: state.font ? state.font.axes : [],
      values: state.values,
      text: els.text.value,
      fontSize: Number(els.fontSize.value) || 72,
      tracking: Number(els.tracking.value) || 0,
      lineSpacing: (Number(els.lineHeight.value) || 1.1) * 100,
      color: els.color.value,
      align: state.align
    };
  }

  // ----------------------------------------------------- outline extraction

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = function () { reject(new Error('Could not load ' + src)); };
      document.head.appendChild(script);
    });
  }

  /**
   * Load the two libraries vector export needs. Order matters: the woff2
   * decompressor is an Emscripten module that publishes a global `Module`,
   * which we capture before anything else can overwrite it.
   */
  function ensureLibs() {
    if (libsPromise) return libsPromise;
    libsPromise = loadScript(CDN.woff2)
      .then(function () {
        var emscripten = window.Module;
        if (!emscripten) throw new Error('The woff2 decompressor did not initialise.');
        return new Promise(function (resolve) {
          if (emscripten.calledRun) resolve(emscripten);
          else emscripten.onRuntimeInitialized = function () { resolve(emscripten); };
        });
      })
      .then(function (emscripten) {
        window.vfWoff2 = emscripten;
        return loadScript(CDN.paper);
      })
      .then(function () {
        // harfbuzzjs ships as an ES module, so it comes in through a dynamic
        // import rather than a script tag.
        return import(CDN.harfbuzz);
      })
      .then(function (harfbuzz) {
        window.vfHarfBuzz = harfbuzz;
      })
      .catch(function (error) {
        libsPromise = null; // Allow a retry after a transient network failure.
        throw error;
      });
    return libsPromise;
  }

  function parseUnicodeRange(text) {
    return text.split(',').map(function (part) {
      var token = part.trim().replace(/^U\+/i, '');
      if (token.indexOf('-') !== -1) {
        var halves = token.split('-');
        return [parseInt(halves[0], 16), parseInt(halves[1], 16)];
      }
      if (token.indexOf('?') !== -1) {
        return [parseInt(token.replace(/\?/g, '0'), 16), parseInt(token.replace(/\?/g, 'F'), 16)];
      }
      var single = parseInt(token, 16);
      return [single, single];
    });
  }

  function rangeCovers(ranges, codepoints) {
    return codepoints.every(function (code) {
      return ranges.some(function (pair) { return code >= pair[0] && code <= pair[1]; });
    });
  }

  /**
   * Choose the @font-face subset that actually contains the user's characters.
   * Google Fonts splits a family across latin / latin-ext / cyrillic / … and we
   * only want to download the one we need.
   */
  function pickSubsetUrl(css, text) {
    var codepoints = [];
    for (var i = 0; i < text.length; i++) {
      var code = text.codePointAt(i);
      if (code > 32) codepoints.push(code);
    }
    var blocks = css.split('@font-face').slice(1);
    var fallback = null;
    for (var b = 0; b < blocks.length; b++) {
      var block = blocks[b];
      // Skip italic faces unless the design asks for one.
      var isItalic = /font-style:\s*italic/.test(block);
      if (isItalic !== (state.values.ital >= 0.5)) continue;
      var src = block.match(/src:\s*url\(([^)]+)\)/);
      if (!src) continue;
      if (!fallback) fallback = src[1];
      var range = block.match(/unicode-range:\s*([^;]+);/);
      if (!range) return src[1];
      if (rangeCovers(parseUnicodeRange(range[1]), codepoints)) return src[1];
    }
    return fallback;
  }

  function fontCacheKey(family) {
    return family + '|' + (state.values.ital >= 0.5 ? 'italic' : 'normal');
  }

  function loadFontBinary(font, text) {
    var key = fontCacheKey(font.family);
    if (fontBinaryCache[key]) return Promise.resolve(fontBinaryCache[key]);

    return ensureLibs()
      .then(function () {
        return fetch(buildFontCssUrl(font.family, font.axes)).then(function (response) {
          if (!response.ok) throw new Error('Google Fonts returned HTTP ' + response.status);
          return response.text();
        });
      })
      .then(function (css) {
        var url = pickSubsetUrl(css, text);
        if (!url) throw new Error('No usable font file was listed for ' + font.family + '.');
        return fetch(url);
      })
      .then(function (response) {
        if (!response.ok) throw new Error('Font download failed (HTTP ' + response.status + ').');
        return response.arrayBuffer();
      })
      .then(function (buffer) {
        var decompressed = window.vfWoff2.decompress(new Uint8Array(buffer));
        var hb = window.vfHarfBuzz;
        var face = new hb.Face(new hb.Blob(new Uint8Array(decompressed)));
        var loaded = { hb: hb, face: face, font: new hb.Font(face), upem: face.upem };
        fontBinaryCache[key] = loaded;
        return loaded;
      });
  }

  /**
   * Resolve contours that cross themselves.
   *
   * Slides fills imported geometry with the even-odd rule; TrueType glyphs are
   * drawn for nonzero. Two *separate* contours that overlap are handled on the
   * server by emitting them as separate shapes, which needs no arithmetic and
   * changes no coordinate. A contour that crosses *itself* cannot be split
   * that way — at heavy weights an `e` or an `a` is often a single
   * self-crossing outline — and under even-odd the crossing punches a hole.
   *
   * So only those contours are handed to paper.js, one at a time. An earlier
   * version unioned the whole word at once and mangled several fonts, filling
   * counters solid; resolving a single contour is the operation these
   * libraries are most reliable at, and everything else passes through
   * untouched.
   */
  function resolveSelfIntersections(commands) {
    if (!window.paper) return commands;
    var contours = splitContours(commands);
    if (!contours.length) return commands;

    var scope = window.paper;
    scope.setup(document.createElement('canvas'));
    try {
      var out = [];
      for (var i = 0; i < contours.length; i++) {
        var contour = contours[i];
        if (!contourSelfIntersects(contour)) {
          out = out.concat(contour);
          continue;
        }
        var resolved = resolveOneContour(scope, contour);
        out = out.concat(resolved || contour);
      }
      return out;
    } catch (error) {
      return commands;
    } finally {
      if (scope.project) scope.project.clear();
    }
  }

  /**
   * Run one contour through paper.js, keeping the original if the result looks
   * nothing like it — a corrupted contour is worse than an unresolved one.
   */
  function resolveOneContour(scope, contour) {
    var before = commandsBounds(contour);
    var compound = new scope.CompoundPath(commandsToPathData(contour));
    var resolved = compound.resolveCrossings();
    var commands = paperToCommands(resolved);
    if (!commands.length) return null;
    var after = commandsBounds(commands);
    var tolerance = Math.max(before.width, before.height) * 0.02;
    if (Math.abs(after.width - before.width) > tolerance ||
        Math.abs(after.height - before.height) > tolerance) {
      return null;
    }
    return commands;
  }

  function splitContours(commands) {
    var contours = [];
    var current = null;
    for (var i = 0; i < commands.length; i++) {
      if (commands[i][0] === 'M') {
        current = [commands[i]];
        contours.push(current);
      } else if (current) {
        current.push(commands[i]);
      }
    }
    return contours.filter(function (c) { return c.length > 1; });
  }

  function commandsBounds(commands) {
    var b = { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    for (var i = 0; i < commands.length; i++) {
      for (var j = 1; j < commands[i].length; j += 2) {
        var x = commands[i][j], y = commands[i][j + 1];
        if (typeof x !== 'number' || typeof y !== 'number') continue;
        if (x < b.x1) b.x1 = x;
        if (x > b.x2) b.x2 = x;
        if (y < b.y1) b.y1 = y;
        if (y > b.y2) b.y2 = y;
      }
    }
    b.width = b.x2 - b.x1;
    b.height = b.y2 - b.y1;
    return b;
  }

  var VF_FLATTEN_SAMPLES = 10;
  var VF_EPS = 1e-7;

  /** Flatten a contour to a polygon, for intersection testing only. */
  function flattenContour(contour) {
    var points = [];
    var current = [0, 0];
    for (var i = 0; i < contour.length; i++) {
      var c = contour[i];
      if (c[0] === 'M' || c[0] === 'L') {
        current = [c[1], c[2]];
        points.push(current);
      } else if (c[0] === 'C' || c[0] === 'Q') {
        var c1, c2, end;
        if (c[0] === 'C') {
          c1 = [c[1], c[2]]; c2 = [c[3], c[4]]; end = [c[5], c[6]];
        } else {
          var q = [c[1], c[2]];
          end = [c[3], c[4]];
          c1 = [current[0] + (2 / 3) * (q[0] - current[0]), current[1] + (2 / 3) * (q[1] - current[1])];
          c2 = [end[0] + (2 / 3) * (q[0] - end[0]), end[1] + (2 / 3) * (q[1] - end[1])];
        }
        for (var s = 1; s <= VF_FLATTEN_SAMPLES; s++) {
          var t = s / VF_FLATTEN_SAMPLES, u = 1 - t;
          points.push([
            u * u * u * current[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * end[0],
            u * u * u * current[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * end[1]
          ]);
        }
        current = end;
      }
    }
    // Drop repeats and the duplicated closing point, so no zero-length segment
    // survives to register as a false crossing.
    var clean = [];
    for (var p = 0; p < points.length; p++) {
      var prev = clean[clean.length - 1];
      if (!prev || Math.abs(prev[0] - points[p][0]) > VF_EPS ||
          Math.abs(prev[1] - points[p][1]) > VF_EPS) clean.push(points[p]);
    }
    while (clean.length > 1) {
      var first = clean[0], last = clean[clean.length - 1];
      if (Math.abs(first[0] - last[0]) < VF_EPS && Math.abs(first[1] - last[1]) < VF_EPS) clean.pop();
      else break;
    }
    return clean;
  }

  function orientation(p, q, r) {
    var v = (q[1] - p[1]) * (r[0] - q[0]) - (q[0] - p[0]) * (r[1] - q[1]);
    return Math.abs(v) < VF_EPS ? 0 : (v > 0 ? 1 : 2);
  }

  /** Proper crossings only: shared endpoints and collinear touches do not count. */
  function segmentsCross(a, b, c, d) {
    var o1 = orientation(a, b, c), o2 = orientation(a, b, d);
    var o3 = orientation(c, d, a), o4 = orientation(c, d, b);
    if (!o1 || !o2 || !o3 || !o4) return false;
    return o1 !== o2 && o3 !== o4;
  }

  function contourSelfIntersects(contour) {
    var points = flattenContour(contour);
    var n = points.length;
    if (n < 4) return false;
    for (var i = 0; i < n; i++) {
      var a = points[i], b = points[(i + 1) % n];
      for (var j = i + 2; j < n; j++) {
        if (i === 0 && j === n - 1) continue; // adjacent across the wrap
        if (segmentsCross(a, b, points[j], points[(j + 1) % n])) return true;
      }
    }
    return false;
  }

  /** Command arrays -> an SVG path string, which is what paper.js parses. */
  function commandsToPathData(commands) {
    return commands.map(function (command) {
      if (command[0] === 'Z') return 'Z';
      return command[0] + command.slice(1).join(' ');
    }).join(' ');
  }

  /**
   * Read paper.js segments straight back into command arrays. Going via
   * segment handles rather than paper's own path string avoids a second
   * rounding step.
   */
  function paperToCommands(item) {
    var paths = item.children && item.children.length ? item.children : [item];
    var commands = [];
    paths.forEach(function (path) {
      var segments = path.segments;
      if (!segments || segments.length < 2) return;
      commands.push(['M', segments[0].point.x, segments[0].point.y]);
      var last = path.closed ? segments.length : segments.length - 1;
      for (var i = 0; i < last; i++) {
        var from = segments[i];
        var to = segments[(i + 1) % segments.length];
        if (from.handleOut.isZero() && to.handleIn.isZero()) {
          commands.push(['L', to.point.x, to.point.y]);
        } else {
          commands.push([
            'C',
            from.point.x + from.handleOut.x, from.point.y + from.handleOut.y,
            to.point.x + to.handleIn.x, to.point.y + to.handleIn.y,
            to.point.x, to.point.y
          ]);
        }
      }
      commands.push(['Z']);
    });
    return commands;
  }

  function commandToArray(command) {
    if (command.type === 'M' || command.type === 'L') return [command.type, command.x, command.y];
    if (command.type === 'C') {
      return ['C', command.x1, command.y1, command.x2, command.y2, command.x, command.y];
    }
    if (command.type === 'Q') return ['Q', command.x1, command.y1, command.x, command.y];
    return ['Z'];
  }

  /**
   * Parse one glyph's SVG path from HarfBuzz into command arrays, placing it
   * at the pen position.
   *
   * HarfBuzz reports outlines in font units with y pointing up; the rest of the
   * pipeline works in points with y pointing down and the baseline at zero, so
   * each coordinate is scaled and flipped on the way through.
   */
  function glyphPathToCommands(pathData, scale, penX, penY) {
    var commands = [];
    var pattern = /([MLQCZmlqcz])([^MLQCZmlqcz]*)/g;
    var match;
    while ((match = pattern.exec(pathData)) !== null) {
      var type = match[1].toUpperCase();
      if (type === 'Z') {
        commands.push(['Z']);
        continue;
      }
      var numbers = match[2].trim().split(/[\s,]+/).filter(function (token) {
        return token.length;
      }).map(Number);
      var command = [type];
      for (var i = 0; i + 1 < numbers.length; i += 2) {
        command.push(numbers[i] * scale + penX);
        command.push(-numbers[i + 1] * scale + penY);
      }
      commands.push(command);
    }
    return commands;
  }

  /**
   * Shape one line with HarfBuzz and return its outlines and advance width.
   * Tracking is applied between glyphs, after shaping, so kerning and any
   * ligature substitution still apply.
   */
  function shapeLine(loaded, line, fontSize, trackingEm) {
    var hb = loaded.hb;
    var scale = fontSize / loaded.upem;
    var tracking = (trackingEm || 0) * fontSize;

    var buffer = new hb.Buffer();
    buffer.addText(line);
    buffer.guessSegmentProperties();
    hb.shape(loaded.font, buffer);
    var infos = buffer.getGlyphInfos();
    var positions = buffer.getGlyphPositions();

    var commands = [];
    var penX = 0;
    var penY = 0;
    for (var i = 0; i < infos.length; i++) {
      var glyphId = infos[i].codepoint === undefined ? infos[i].g : infos[i].codepoint;
      var pathData = loaded.font.glyphToPath(glyphId);
      if (pathData) {
        commands = commands.concat(glyphPathToCommands(
          pathData,
          scale,
          penX + (positions[i].xOffset || 0) * scale,
          penY - (positions[i].yOffset || 0) * scale));
      }
      penX += (positions[i].xAdvance || 0) * scale;
      penY -= (positions[i].yAdvance || 0) * scale;
      if (i < infos.length - 1) penX += tracking;
    }
    return { commands: commands, width: penX };
  }

  /**
   * Lay the text out and return flat path commands in points, y down, first
   * baseline at y = 0 (which is what the DrawingML builder expects).
   */
  function buildOutlines(loaded, spec) {
    var hb = loaded.hb;
    var axisInfos = loaded.face.getAxisInfos();
    var variations = [];
    Object.keys(axisInfos).forEach(function (tag) {
      var value = spec.values[tag];
      variations.push(new hb.Variation(
        tag, value === undefined ? axisInfos[tag].default : value));
    });
    loaded.font.setVariations(variations);

    var lines = String(spec.text).split('\n');
    var shaped = lines.map(function (line) {
      return line ? shapeLine(loaded, line, spec.fontSize, spec.tracking) : { commands: [], width: 0 };
    });
    var maxWidth = shaped.reduce(function (widest, line) {
      return Math.max(widest, line.width);
    }, 0);
    var lineAdvance = spec.fontSize * ((spec.lineSpacing || 110) / 100);

    var commands = [];
    shaped.forEach(function (line, index) {
      if (!line.commands.length) return;
      var offsetX = 0;
      if (spec.align === 'center') offsetX = (maxWidth - line.width) / 2;
      else if (spec.align === 'right') offsetX = maxWidth - line.width;
      var offsetY = index * lineAdvance;
      line.commands.forEach(function (command) {
        var moved = [command[0]];
        for (var i = 1; i + 1 < command.length; i += 2) {
          moved.push(command[i] + offsetX);
          moved.push(command[i + 1] + offsetY);
        }
        commands.push(moved);
      });
    });

    try {
      return resolveSelfIntersections(commands);
    } catch (resolveError) {
      // Raw outlines still beat no outlines; self-crossings will show as
      // even-odd artefacts, which is what the warning is for.
      setStatus('Could not resolve self-crossing outlines (' + resolveError.message +
        '); inserting raw outlines, which may show notches.', 'warn');
      return commands;
    }
  }

  // ------------------------------------------------------------- actions

  function insert() {
    if (!state.font) { setStatus('Pick a typeface first.', 'error'); return; }
    var spec = currentSpec();
    if (!spec.text.trim()) { setStatus('Type something to insert.', 'error'); return; }

    busy(true);
    setStatus('Building vector outlines…');
    loadFontBinary(state.font, spec.text)
      .then(function (loadedFont) {
        var commands = buildOutlines(loadedFont, spec);
        if (!commands.length) throw new Error('That text produced no visible outlines.');
        if (commands.length > MAX_OUTLINE_COMMANDS) {
          throw new Error('That is too much text to outline (' + commands.length +
            ' segments). Try a shorter headline.');
        }
        setStatus('Importing ' + commands.length + ' path segments…');
        return call('apiInsertVector', {
          commands: commands,
          color: spec.color,
          text: spec.text,
          family: spec.family
        });
      })
      .then(function (result) {
        var suffix = result.scale && result.scale < 0.999
          ? ' Scaled to ' + Math.round(result.scale * 100) + '% to fit the slide.'
          : '';
        setStatus(result.message + suffix, 'ok');
      })
      .catch(function (error) { setStatus(error.message, 'error'); })
      .then(function () { busy(false); });
  }

  // --------------------------------------------------------- font picking

  function renderFontList(filter) {
    var needle = (filter || '').trim().toLowerCase();
    var matches = state.fonts.filter(function (font) {
      return !needle || font.family.toLowerCase().indexOf(needle) !== -1;
    });
    els.fontSelect.innerHTML = '';
    matches.slice(0, 400).forEach(function (font) {
      var option = document.createElement('option');
      option.value = font.family;
      option.textContent = font.family + '  (' +
        font.axes.map(function (axis) { return axis.tag; }).join(' ') + ')';
      els.fontSelect.appendChild(option);
    });
    if (state.font) els.fontSelect.value = state.font.family;
    els.fontMeta.textContent = matches.length + ' of ' + state.fonts.length + ' variable fonts';
  }

  function selectFont(font, values) {
    state.font = font;
    state.values = {};
    font.axes.forEach(function (axis) {
      var supplied = values && values[axis.tag];
      state.values[axis.tag] = supplied === undefined
        ? axis.defaultValue
        : Math.min(axis.max, Math.max(axis.min, supplied));
    });
    els.fontSelect.value = font.family;
    ensurePreviewFont(font);
    renderAxes();
    renderPreview();
  }

  // ------------------------------------------------------------ segments

  function setSegment(group, value) {
    Array.prototype.forEach.call(group.querySelectorAll('.seg-btn'), function (button) {
      button.classList.toggle('is-active', button.dataset.value === value);
    });
    if (group === els.align) state.align = value;
  }

  function wireSegment(group) {
    group.addEventListener('click', function (event) {
      var button = event.target.closest('.seg-btn');
      if (!button) return;
      setSegment(group, button.dataset.value);
      renderPreview();
    });
  }

  // ------------------------------------------------------------ bootstrap

  function init() {
    [
      'app', 'status', 'text', 'font-search', 'font-select', 'font-meta', 'preview',
      'preview-hint', 'axes', 'reset-axes', 'font-size', 'tracking', 'line-height',
      'color', 'align', 'insert'
    ].forEach(function (id) {
      els[id.replace(/-(\w)/g, function (_, c) { return c.toUpperCase(); })] = $(id);
    });

    wireSegment(els.align);

    els.fontSearch.addEventListener('input', function () {
      renderFontList(els.fontSearch.value);
    });
    els.fontSelect.addEventListener('change', function () {
      var chosen = state.fonts.filter(function (font) {
        return font.family === els.fontSelect.value;
      })[0];
      if (chosen) selectFont(chosen);
    });

    var repaint = debounce(renderPreview, 60);
    ['text', 'fontSize', 'tracking', 'lineHeight', 'color'].forEach(function (key) {
      els[key].addEventListener('input', repaint);
    });

    els.resetAxes.addEventListener('click', resetAxes);
    els.insert.addEventListener('click', insert);

    setStatus('Loading fonts…');
    call('apiBootstrap')
      .then(function (result) {
        state.fonts = result.fonts || [];
        state.axisRegistry = result.axisRegistry || {};
        renderFontList('');
        var initial = state.fonts.filter(function (font) {
          return font.family === DEFAULT_FAMILY;
        })[0] || state.fonts[0];
        if (initial) selectFont(initial);
        setStatus(result.warning || '', result.warning ? 'warn' : '');
      })
      .catch(function (error) {
        setStatus('Could not load fonts: ' + error.message, 'error');
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
