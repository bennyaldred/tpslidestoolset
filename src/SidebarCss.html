<style>
  :root {
    --bg: #ffffff;
    --fg: #1f1f1f;
    --muted: #5f6368;
    --line: #dadce0;
    --accent: #1a73e8;
    --accent-weak: #e8f0fe;
    --warn-bg: #fef7e0;
    --warn-fg: #7a5900;
    --err-bg: #fce8e6;
    --err-fg: #a50e0e;
    --ok-bg: #e6f4ea;
    --ok-fg: #137333;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 12px 12px 32px;
    font: 13px/1.45 'Google Sans', Roboto, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }

  .block { margin-bottom: 18px; }
  .block:last-child { margin-bottom: 0; }

  .label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .row { display: flex; gap: 6px; align-items: center; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  .field { display: block; }
  .field-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }

  .input, .select, .textarea {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
  }
  .textarea { resize: vertical; font-size: 13px; }
  .input:focus, .select:focus, .textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .input.color { padding: 2px; height: 32px; cursor: pointer; }
  .select { margin-top: 6px; }

  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }

  .link-btn {
    background: none; border: none; padding: 0;
    color: var(--accent); font: inherit; font-size: 11px; cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }

  /* --- Preview ------------------------------------------------------- */
  .preview-frame {
    border: 1px solid var(--line);
    border-radius: 6px;
    background:
      linear-gradient(45deg, #f3f3f3 25%, transparent 25%, transparent 75%, #f3f3f3 75%),
      linear-gradient(45deg, #f3f3f3 25%, #fff 25%, #fff 75%, #f3f3f3 75%);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
    overflow: auto;
    min-height: 96px;
    max-height: 220px;
    display: flex;
    align-items: center;
    padding: 10px;
  }
  .preview {
    white-space: pre;
    line-height: 1.1;
    color: #1a1a1a;
    /* Sized in JS so the preview tracks the real point size, scaled to fit. */

    /* Left on "auto", the browser derives opsz from the rendered size, which
       would quietly disagree with the opsz slider — and with the geometry that
       actually gets inserted. */
    font-optical-sizing: none;
  }

  /* --- Axis sliders --------------------------------------------------- */
  .axis { margin-bottom: 10px; }
  .axis-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; margin-bottom: 2px;
  }
  .axis-name { color: var(--fg); font-weight: 500; }
  .axis-tag { color: var(--muted); font-family: 'Roboto Mono', monospace; font-size: 10px; }
  .axis-value {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border: none; background: none; text-align: right; width: 62px; padding: 0;
  }
  .axis-value:focus { outline: 1px solid var(--accent); border-radius: 2px; }
  .axis input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  /* --- Segmented control ---------------------------------------------- */
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg-btn {
    flex: 1; padding: 6px 4px; font: inherit; font-size: 12px;
    background: #fff; border: none; border-right: 1px solid var(--line);
    color: var(--muted); cursor: pointer;
  }
  .seg-btn:last-child { border-right: none; }
  .seg-btn.is-active { background: var(--accent-weak); color: var(--accent); font-weight: 500; }

  /* --- Buttons -------------------------------------------------------- */
  .actions { position: sticky; bottom: 0; background: var(--bg); padding-top: 6px; }
  .btn {
    flex: 1;
    font: inherit; font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--fg);
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: #f8f9fa; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary {
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
    padding: 10px;
    margin-bottom: 6px;
  }
  .btn-primary:hover:not(:disabled) { background: #1765cc; }

  /* --- Status --------------------------------------------------------- */
  .status {
    padding: 7px 9px; border-radius: 4px; font-size: 12px; margin-bottom: 12px;
    background: var(--accent-weak); color: var(--accent);
  }
  .status.is-error { background: var(--err-bg); color: var(--err-fg); }
  .status.is-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .status.is-ok { background: var(--ok-bg); color: var(--ok-fg); }

  .is-busy { opacity: .6; pointer-events: none; }
</style>
<style>
  /* --- Tabs ------------------------------------------------------------ */
  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--line);
    margin: -4px 0 14px;
  }
  .tab {
    flex: 1;
    padding: 8px 6px;
    font: inherit;
    font-size: 13px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    color: var(--muted);
    cursor: pointer;
  }
  .tab:hover { color: var(--fg); }
  .tab.is-active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  .select-one {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
  }
  .select-one:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* --- Icon grid -------------------------------------------------------- */
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 2px;
    margin-top: 6px;
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px;
    /* The glyphs are drawn by the live variable font, so the grid previews the
       exact axis settings that will be inserted. */
    font-family: 'Material Symbols Outlined';
    font-size: 22px;
    line-height: 1;
    /* As above: the opsz slider must win, not the 22px cell size. */
    font-optical-sizing: none;
  }
  .icon-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    border: 1px solid transparent;
    border-radius: 4px;
    background: none;
    cursor: pointer;
    color: var(--fg);
    font: inherit;
    padding: 0;
    /* Until the webfont arrives the cell would show the raw private-use
       character; hide that rather than flash mojibake. */
    overflow: hidden;
  }
  .icon-cell:hover { background: var(--accent-weak); }
  .icon-cell.is-selected { border-color: var(--accent); background: var(--accent-weak); }
  .icon-grid.is-loading { color: transparent; }

  .icon-empty { grid-column: 1 / -1; padding: 14px 6px; text-align: center; color: var(--muted); font-size: 11px; font-family: 'Google Sans', Roboto, Arial, sans-serif; }
</style>
